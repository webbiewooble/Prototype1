<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 145" width="450" height="145" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&amp;display=swap');
      .wordmark {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 100px;
        letter-spacing: -3px;
      }
      .tagline {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 5px;
      }
      .tm {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 24px;
      }
    </style>
  </defs>

  <g id="tomato-brand-logo">
    <!-- Main Wordmark -->
    <text x="0" y="100" class="wordmark" fill="#FFFFFF">Tomato</text>
    <text x="408" y="50" class="tm" fill="#FFFFFF">TM</text>

    <!-- Leaf Accent positioned near the first 'o' -->
    <g transform="translate(108, 48)">
      <path d="M -10 10 C -13 1, -7 -12, 12 -12 C 7 -2, 13 8, -10 10 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
      <path d="M -10 10 C -13 1, -7 -12, 12 -12 C 7 -2, 13 8, -10 10 Z" fill="#1E7A34" />
      <path d="M -8.5 9 C -2 1, 3 -4, 9.5 -9.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Tagline: WEAR A BRIGHTER YOU -->
    <text x="215" y="132" class="tagline" text-anchor="middle" fill="#FFFFFF">WEAR A BRIGHTER YOU</text>
  </g>
</svg>